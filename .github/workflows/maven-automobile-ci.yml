name: Automotive - Automobile CI

env:
  JAVA_VERSION: "21"
  DISTRIBUTION: "temurin"

on:
  push:
    paths:
      - "Automobile/**"
      - ".github/workflows/automotive-automobile-ci.yml"
  pull_request:
    paths:
      - "Automobile/**"
      - ".github/workflows/automotive-automobile-ci.yml"
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Automobile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: Automobile/pom.xml

      - name: Build and run unit tests
        working-directory: Automobile
        run: mvn -B -ntp test

  publish-package:
    name: Publish package
    if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: Automobile/pom.xml
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build with Maven
        working-directory: Automobile
        run: mvn -B -ntp package --file pom.xml

      - name: Publish to GitHub Packages Apache Maven
        working-directory: Automobile
        run: mvn -B -ntp deploy -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ github.token }}
